[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mjd-square-api"
version = "0.1.0"
description = "MJD Square business management API"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1",
  "alembic>=1.14",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.16",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
